[build]
  publish = "src"
  command = "npm run test:real && npm run test:3d && npm run test:reviews && npm run test:workflow && npm run test:large && npm run test:bcf"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--ignore-scripts"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
