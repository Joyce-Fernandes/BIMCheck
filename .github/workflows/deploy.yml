name: Validate BIMCheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        
    - name: Install dependencies
      run: npm ci --ignore-scripts
      
    - name: Run tests
      run: |
        npm run test:real
        npm run test:3d
        npm run test:reviews
        npm run test:workflow
        npm run test:large
        npm run test:bcf
